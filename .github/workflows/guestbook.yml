name: Guestbook

on:
  issues:
    types: [opened]
  workflow_dispatch: # re-render after editing data/guestbook.json by hand

permissions:
  contents: write
  issues: write

concurrency:
  group: guestbook
  cancel-in-progress: false

jobs:
  sign:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.issue.title, 'sign')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Get fonts (JetBrains Mono, Instrument Serif, both OFL)
        run: |
          curl -sSL -o jbm.zip https://github.com/JetBrains/JetBrainsMono/releases/download/v2.304/JetBrainsMono-2.304.zip
          mkdir -p fonts && unzip -q -j jbm.zip 'fonts/ttf/JetBrainsMono-Regular.ttf' 'fonts/ttf/JetBrainsMono-Medium.ttf' -d fonts
          curl -sSL -o fonts/InstrumentSerif-Regular.ttf https://github.com/google/fonts/raw/main/ofl/instrumentserif/InstrumentSerif-Regular.ttf
      - name: Record signature
        if: github.event_name == 'issues'
        run: uv run --no-project --with 'fonttools[woff]' scripts/guestbook.py sign
        env:
          REPLY_FILE: ${{ runner.temp }}/reply.txt
      - name: Render card
        run: uv run --no-project --with 'fonttools[woff]' scripts/guestbook.py render
      - name: Commit
        run: |
          git add data assets/guestbook-*.svg
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: guestbook signature"
          git pull --rebase -q && git push
      - name: Reply and close
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          reply="$(cat "$RUNNER_TEMP/reply.txt")"
          [ -z "$reply" ] && exit 0
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body "$reply"
          gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY"
